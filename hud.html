<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>Teams Wake Translation HUD</title>
  <style>
    :root {
      --bg: rgba(22, 28, 40, 0.52);
      --border: rgba(255, 255, 255, 0.18);
      --accent: #00ffd5;
      --accent-grad: linear-gradient(135deg, #00ffd5, #0088ff);
      --text-primary: #ffffff;
      --text-muted: #a6b5ca;
      --card-inner: rgba(255, 255, 255, 0.08);
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background: transparent;
      color: var(--text-primary);
      overflow: hidden;
      user-select: text;
      -webkit-font-smoothing: antialiased;
      padding: 0;
      margin: 0;
    }

    .hud-card {
      background: rgba(22, 28, 40, 0.76);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 11px;
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.4);
      padding: 9px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      animation: popIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.96) translateY(4px);
      }

      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .hud-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
    }

    .provider-tag {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.2px;
    }

    .provider-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }

    .lang-badge {
      background: rgba(0, 255, 213, 0.12);
      color: var(--accent);
      border: 1px solid rgba(0, 255, 213, 0.25);
      border-radius: 5px;
      padding: 1px 5px;
      font-size: 10px;
      font-weight: 500;
    }

    .hud-content {
      padding: 1px 0;
      max-height: 180px;
      overflow-y: auto;
    }

    .translated-text {
      font-size: 13px;
      line-height: 1.42;
      font-weight: 450;
      letter-spacing: 0.15px;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
      word-break: break-word;
      user-select: text;
    }

    .hud-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      padding-top: 2px;
    }

    .original-snippet {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 170px;
      opacity: 0.8;
    }

    .hud-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 5px;
      color: #fff;
      font-size: 11px;
      font-weight: 500;
      padding: 3px 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.18s ease;
    }

    .btn-replace {
      background: rgba(0, 120, 212, 0.3);
      border-color: rgba(0, 120, 212, 0.55);
      color: #79c0ff;
    }

    .btn-replace:hover {
      background: #0078d4;
      border-color: #0078d4;
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 120, 212, 0.4);
    }

    .btn-replace.replaced {
      background: #2ed573;
      color: #ffffff;
      border-color: #2ed573;
    }

    .btn-copy:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.3);
      font-weight: 600;
    }

    .btn-copy.copied {
      background: #2ed573;
      color: #ffffff;
      border-color: #2ed573;
    }
  </style>
</head>

<body>
  <div class="hud-card" id="hud-card">
    <div class="hud-header">
      <div class="provider-tag">
        <span class="provider-dot"></span>
        <span id="provider-name">Microsoft Translator</span>
        <span class="lang-badge" id="lang-badge">外文 → 中文</span>
      </div>
    </div>

    <div class="hud-content">
      <div class="translated-text" id="translated-text">正在翻译...</div>
    </div>

    <div class="hud-footer">
      <span class="original-snippet" id="original-snippet"></span>
      <div class="hud-actions">
        <button class="btn-action btn-replace" id="btn-replace" title="用译文替换选中文本 (Enter)">
          <span id="btn-replace-text">Replace</span>
        </button>
        <button class="btn-action btn-copy" id="btn-copy" title="复制译文到剪贴板">
          <span id="btn-copy-text">Copy</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const hudCard = document.getElementById('hud-card');
    const providerNameEl = document.getElementById('provider-name');
    const langBadgeEl = document.getElementById('lang-badge');
    const translatedTextEl = document.getElementById('translated-text');
    const originalSnippetEl = document.getElementById('original-snippet');
    const btnReplace = document.getElementById('btn-replace');
    const btnReplaceText = document.getElementById('btn-replace-text');
    const btnCopy = document.getElementById('btn-copy');
    const btnCopyText = document.getElementById('btn-copy-text');

    let currentTranslation = '';
    let autoDismissTimer = null;
    let dismissTimeoutMs = 15000; // Default 15s

    function resetTimer() {
      if (autoDismissTimer) clearTimeout(autoDismissTimer);
      if (dismissTimeoutMs <= 0) return; // 0 or negative = never auto-dismiss
      autoDismissTimer = setTimeout(() => {
        dismissHud();
      }, dismissTimeoutMs);
    }

    function dismissHud() {
      if (autoDismissTimer) clearTimeout(autoDismissTimer);
      hudCard.style.opacity = '0';
      hudCard.style.transform = 'scale(0.96) translateY(4px)';
      setTimeout(() => {
        if (window.hudApi) window.hudApi.hideHud();
      }, 200);
    }

    // Pause timer on hover
    hudCard.addEventListener('mouseenter', () => {
      if (autoDismissTimer) clearTimeout(autoDismissTimer);
    });

    hudCard.addEventListener('mouseleave', () => {
      resetTimer();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        dismissHud();
      } else if (e.key === 'Enter') {
        btnReplace.click();
      }
    });

    btnCopy.addEventListener('click', () => {
      if (!currentTranslation) return;
      if (window.hudApi) {
        window.hudApi.copyToClipboard(currentTranslation);
      } else {
        navigator.clipboard.writeText(currentTranslation);
      }
      btnCopy.classList.add('copied');
      btnCopyText.textContent = '✓ Copied';
      setTimeout(() => {
        dismissHud();
      }, 500);
    });

    btnReplace.addEventListener('click', () => {
      if (!currentTranslation) return;
      btnReplace.classList.add('replaced');
      btnReplaceText.textContent = '✓ Replaced';
      if (window.hudApi) {
        window.hudApi.replaceSelection(currentTranslation);
      }
      setTimeout(() => {
        dismissHud();
      }, 150);
    });

    if (window.hudApi) {
      window.hudApi.onShowHud((data) => {
        if (typeof data.dismissSeconds === 'number') {
          dismissTimeoutMs = data.dismissSeconds * 1000;
        }
        currentTranslation = data.translated || '';
        translatedTextEl.textContent = currentTranslation;
        originalSnippetEl.textContent = data.original || '';
        providerNameEl.textContent = data.provider === 'google' ? 'Google Translate' : 'Microsoft Translator';
        langBadgeEl.textContent = data.direction || '外文 → 中文';

        btnCopy.classList.remove('copied');
        btnCopyText.textContent = 'Copy';
        btnReplace.classList.remove('replaced');
        btnReplaceText.textContent = 'Replace';
        hudCard.style.opacity = '1';
        hudCard.style.transform = 'scale(1) translateY(0)';

        // Report height to main process
        requestAnimationFrame(() => {
          const height = document.body.scrollHeight;
          window.hudApi.updateHudHeight(Math.min(Math.max(height, 90), 280));
        });

        resetTimer();
      });
    }
  </script>
</body>

</html>
